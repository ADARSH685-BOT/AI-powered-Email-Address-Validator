<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Email Validator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="background-glow"></div>
    
    <main class="container">
        <header>
            <div class="logo">
                <i data-lucide="shield-check"></i>
                <h1>Verify<span>AI</span></h1>
            </div>
            <p class="subtitle">Advanced Neural Email Validation</p>
        </header>

        <section class="validator-card">
            <div class="input-group">
                <input type="email" id="emailInput" placeholder="Enter email address..." autocomplete="off">
                <button id="validateBtn">
                    <span class="btn-text">Validate</span>
                    <div class="loader" id="loader"></div>
                </button>
            </div>
            
            <div id="results" class="results-container hidden">
                <div class="result-header">
                    <div class="score-ring">
                        <svg viewBox="0 0 36 36" class="circular-chart">
                            <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path id="scorePath" class="circle" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <text x="18" y="20.35" class="percentage" id="scoreText">0%</text>
                        </svg>
                    </div>
                    <div class="status-info">
                        <h2 id="statusTitle">Validating...</h2>
                        <p id="summaryText">Analyzing email patterns and domain reputation.</p>
                    </div>
                </div>

                <div id="issuesSection" class="info-section">
                    <h3><i data-lucide="alert-circle"></i> Findings</h3>
                    <ul id="issuesList"></ul>
                </div>

                <div id="suggestionSection" class="info-section suggestion hidden">
                    <h3><i data-lucide="lightbulb"></i> Suggestion</h3>
                    <p id="suggestionText"></p>
                </div>
            </div>
        </section>

        <footer>
            <p>Powered by Claude 3.5 Sonnet &bull; Premium AI Validator</p>
        </footer>
    </main>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
